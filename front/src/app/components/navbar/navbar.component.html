<div class="navbar-wrapper" [class.scrolled]="isScrolled">
  <nav class="navbar">
    <div class="navbar-brand">
      <a routerLink="/" class="logo">
        <mat-icon>eco</mat-icon>
        <span class="logo-text">YELHA</span>
      </a>
      <span class="subtitle">Anti-gaspillage alimentaire</span>
    </div>
    
    <div class="navbar-menu" [class.is-active]="isMenuOpen">
      <a routerLink="/stores" routerLinkActive="active" class="nav-link" [routerLinkActiveOptions]="{exact: false}">
        <mat-icon>store</mat-icon>
        <span>Magasins</span>
      </a>
      
      <a routerLink="/products" routerLinkActive="active" class="nav-link" [routerLinkActiveOptions]="{exact: false}">
        <mat-icon>inventory_2</mat-icon>
        <span>Produits</span>
      </a>
      
      <a routerLink="/cart" routerLinkActive="active" class="nav-link cart-link" [routerLinkActiveOptions]="{exact: true}">
        <div class="cart-icon">
          <mat-icon>shopping_cart</mat-icon>
          <span class="cart-count" *ngIf="cartItemCount > 0">{{ cartItemCount }}</span>
        </div>
        <span>Panier</span>
      </a>
    </div>

    <div class="navbar-icons">
      <div class="user-menu">
        <div *ngIf="!isLoggedIn">
          <a routerLink="/auth/login" class="auth-link">
            <mat-icon>login</mat-icon>
            Connexion
          </a>
          <a routerLink="/auth/register" class="auth-link">
            <mat-icon>person_add</mat-icon>
            Inscription
          </a>
        </div>
        <div *ngIf="isLoggedIn">
          <button class="user-btn" (click)="toggleUserMenu()">
            <mat-icon>person</mat-icon>
            <span>Mon Compte</span>
          </button>
          <div class="dropdown-menu" *ngIf="isUserMenuOpen">
            <a routerLink="/user">
              <mat-icon>account_circle</mat-icon>
              Mon Profil
            </a>
            <a routerLink="/orders">
              <mat-icon>shopping_bag</mat-icon>
              Mes Commandes
            </a>
            <a routerLink="/favorites">
              <mat-icon>favorite</mat-icon>
              Mes Favoris
            </a>
            <div class="dropdown-divider"></div>
            <a (click)="logout()">
              <mat-icon>logout</mat-icon>
              Déconnexion
            </a>
          </div>
        </div>
      </div>
    </div>

    <button class="menu-toggle" (click)="isMenuOpen = !isMenuOpen">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>
</div>
