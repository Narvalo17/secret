<div class="shopping-cart">
  <div class="header">
    <h2>Mon Panier</h2>
    <button class="btn btn-danger" 
            [disabled]="cartItems.length === 0 || loading"
            (click)="clearCart()">
      <i class="fas fa-trash"></i> Vider le panier
    </button>
  </div>

  <div class="cart-content">
    <div *ngIf="loading" class="loading">
      <i class="fas fa-spinner fa-spin"></i> Chargement...
    </div>

    <div *ngIf="!loading && cartItems.length === 0" class="empty-cart">
      <i class="fas fa-shopping-cart"></i>
      <p>Votre panier est vide</p>
    </div>

    <div *ngIf="!loading && cartItems.length > 0" class="cart-items">
      <div class="cart-item" *ngFor="let item of cartItems">
        <div class="item-image">
          <img [src]="getProductImageUrl(item)" [alt]="item.productName || 'Image produit'">
        </div>
        <div class="item-details">
          <h3>{{ item.productName }}</h3>
          <p class="price">{{ formatPrice(item.productPrice || 0) }}</p>
        </div>
        <div class="item-quantity">
          <button class="btn btn-sm" 
                  (click)="updateQuantity(item.productId, (item.quantity || 1) - 1)"
                  [disabled]="(item.quantity || 0) <= 1 || loading">
            <i class="fas fa-minus"></i>
          </button>
          <span>{{ item.quantity || 1 }}</span>
          <button class="btn btn-sm" 
                  (click)="updateQuantity(item.productId, (item.quantity || 1) + 1)"
                  [disabled]="loading">
            <i class="fas fa-plus"></i>
          </button>
        </div>
        <div class="item-total">
          {{ formatPrice((item.productPrice || 0) * (item.quantity || 1)) }}
        </div>
        <button class="btn btn-danger btn-sm" 
                (click)="removeItem(item.productId)"
                [disabled]="loading">
          <i class="fas fa-trash"></i>
        </button>
      </div>

      <div class="cart-summary">
        <div class="total">
          <span>Total :</span>
          <span class="amount">{{ formatPrice(total) }}</span>
        </div>
        <button class="btn btn-primary btn-lg">
          Passer la commande
        </button>
      </div>
    </div>
  </div>
</div>
