<div class="cart-container">
  <h2>Votre Panier</h2>

  <!-- Indicateur de chargement -->
  <div class="loading-indicator" *ngIf="loading">
    <i class="fas fa-spinner fa-spin"></i> Chargement de votre panier...
  </div>

  <div class="cart-content" *ngIf="!loading && cart && cart.items.length > 0">
    <div class="cart-items">
      <div class="cart-item" *ngFor="let item of cart.items">
        <div class="item-image">
          <img [src]="item.imageUrl || '/assets/images/product-placeholder.png'" [alt]="item.name">
        </div>
        <div class="item-details">
          <h3>{{ item.name }}</h3>
          <p class="description" *ngIf="item.description">{{ item.description }}</p>
          <div class="price-info">
            <span class="original-price" *ngIf="item.discountPercentage > 0">{{ item.originalPrice | currency:'EUR' }}</span>
            <span class="current-price">{{ item.price | currency:'EUR' }}</span>
          </div>
          <div class="quantity-controls">
            <button (click)="updateItemQuantity(item.id, item.quantity - 1)" 
                    [disabled]="item.quantity <= 1 || loading">
              <i class="fas fa-minus"></i>
            </button>
            <span class="quantity">{{ item.quantity }}</span>
            <button (click)="updateItemQuantity(item.id, item.quantity + 1)"
                    [disabled]="loading">
              <i class="fas fa-plus"></i>
            </button>
          </div>
          <button class="remove-btn" (click)="removeItem(item.id)"
                  [disabled]="loading">
            <i class="fas fa-trash"></i> Supprimer
          </button>
        </div>
      </div>
    </div>

    <div class="cart-summary">
      <h3>Résumé de la commande</h3>
      <div class="summary-line">
        <span>Total</span>
        <span class="total-price">{{ cart.total | currency:'EUR' }}</span>
      </div>
      <button class="checkout-btn" (click)="checkout()" [disabled]="loading">
        Passer la commande
      </button>
      <button class="clear-cart-btn" (click)="clearAllItems()" [disabled]="loading">
        <i class="fas fa-trash"></i> Vider le panier
      </button>
    </div>
  </div>

  <div class="empty-cart" *ngIf="!loading && (!cart || cart.items.length === 0)">
    <i class="fas fa-shopping-cart"></i>
    <p>Votre panier est vide</p>
    <button routerLink="/stores">Voir les magasins</button>
  </div>
</div>
