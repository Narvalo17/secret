<div class="profile-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Mon Profil</mat-card-title>
      <div class="header-actions" *ngIf="!isEditing">
        <button mat-raised-button color="primary" (click)="onEdit()">
          Modifier
        </button>
      </div>
    </mat-card-header>

    <mat-card-content>
      <!-- Messages d'erreur et de succès -->
      <div *ngIf="error" class="alert alert-error">
        {{ error }}
      </div>
      <div *ngIf="success" class="alert alert-success">
        {{ success }}
      </div>

      <!-- Formulaire -->
      <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
        <div class="form-row">
          <mat-form-field appearance="outline">
            <mat-label>Prénom</mat-label>
            <input matInput formControlName="firstName" [readonly]="!isEditing">
            <mat-error *ngIf="profileForm.get('firstName')?.hasError('required')">
              Le prénom est requis
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Nom</mat-label>
            <input matInput formControlName="lastName" [readonly]="!isEditing">
            <mat-error *ngIf="profileForm.get('lastName')?.hasError('required')">
              Le nom est requis
            </mat-error>
          </mat-form-field>
        </div>

        <div class="form-row">
          <mat-form-field appearance="outline">
            <mat-label>Email</mat-label>
            <input matInput formControlName="email" [readonly]="!isEditing">
            <mat-error *ngIf="profileForm.get('email')?.hasError('required')">
              L'email est requis
            </mat-error>
            <mat-error *ngIf="profileForm.get('email')?.hasError('email')">
              Format d'email invalide
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Téléphone</mat-label>
            <input matInput formControlName="phoneNumber" [readonly]="!isEditing">
            <mat-error *ngIf="profileForm.get('phoneNumber')?.hasError('required')">
              Le numéro de téléphone est requis
            </mat-error>
          </mat-form-field>
        </div>

        <div class="password-section" *ngIf="isEditing">
          <h3>Confirmation</h3>
          
          <mat-form-field appearance="outline">
            <mat-label>Mot de passe actuel</mat-label>
            <input matInput type="password" formControlName="currentPassword">
            <mat-error *ngIf="profileForm.get('currentPassword')?.hasError('required')">
              Le mot de passe est requis
            </mat-error>
          </mat-form-field>
        </div>

        <!-- Boutons de contrôle -->
        <div class="form-actions" *ngIf="isEditing">
          <button mat-button type="button" (click)="onCancel()">
            Annuler
          </button>
          <button mat-raised-button color="primary" type="submit" [disabled]="!profileForm.valid">
            Enregistrer
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
